name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          PROJECT_DIR=$(find project -name settings.gradle.kts -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Android project was not found"
            find project -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Fix Compose imports
        shell: bash
        run: |
          for file in \
            "$PROJECT_DIR/app/src/main/java/com/school/attendance/ui/AppRoot.kt" \
            "$PROJECT_DIR/app/src/main/java/com/school/attendance/ui/AttendanceScreen.kt" \
            "$PROJECT_DIR/app/src/main/java/com/school/attendance/ui/ReportsScreen.kt" \
            "$PROJECT_DIR/app/src/main/java/com/school/attendance/ui/StudentsScreen.kt"
          do
            sed -i '/^package /a import androidx.compose.runtime.saveable.rememberSaveable' "$file"
          done

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolAttendance-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
