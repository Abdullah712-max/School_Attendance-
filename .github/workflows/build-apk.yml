name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf project
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

          if [ ! -f project/settings.gradle.kts ]; then
            echo "Android project was not extracted correctly"
            find project -maxdepth 3 -type f
            exit 1
          fi

      - name: Fix Compose imports
        working-directory: project
        shell: bash
        run: |
          for file in \
            app/src/main/java/com/school/attendance/ui/AppRoot.kt \
            app/src/main/java/com/school/attendance/ui/AttendanceScreen.kt \
            app/src/main/java/com/school/attendance/ui/ReportsScreen.kt \
            app/src/main/java/com/school/attendance/ui/StudentsScreen.kt
          do
            sed -i '/^package /a import androidx.compose.runtime.saveable.rememberSaveable' "$file"
          done

      - name: Build debug APK
        working-directory: project
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolAttendance-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
